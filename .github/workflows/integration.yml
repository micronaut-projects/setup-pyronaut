name: Integration

# Runs the action against the real Pyronaut CLI and a real project, all the way
# through `pyronaut test`.
#
# CI proves the action's own wiring against a stub CLI on every push. This
# workflow proves the thing CI cannot: that a genuine `pyronaut setup` finds the
# GraalVM this action set up, that the GraalPy environment it builds satisfies
# `pyronaut test`, and that the caches hold across jobs. It is manual because it
# needs a published — or at least reachable — Pyronaut release, and because it
# downloads a full SDK on a cold cache.

on:
  workflow_dispatch:
    inputs:
      pyronaut-version:
        description: 'Pyronaut version to install from PyPI, or `latest`.'
        required: false
        default: 'latest'
      graalvm-version:
        description: 'GraalVM release to set up.'
        required: false
        default: '25.3'
      runner:
        description: 'Runner to use.'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest

permissions:
  contents: read

jobs:
  hello-world:
    name: Hello world on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the hello-world project
        run: |
          set -euo pipefail
          project="${{ runner.temp }}/hello-world"
          mkdir -p "$project/src" "$project/tests" "$project/config"

          cat > "$project/pyproject.toml" <<'TOML'
          [project]
          name = "hello-pyronaut"
          version = "0.1.0"
          dynamic = ["scripts"]

          [build-system]
          requires = ["setuptools", "wheel", "tomli"]
          build-backend = "setuptools.build_meta"

          [tool.pyronaut]
          repositories = [
            "mavenCentral",
            "https://central.sonatype.com/repository/maven-snapshots/"
          ]

          [tool.pyronaut.dependencies]
          runtime = [
            "io.micronaut:micronaut-http-server-netty",
            "io.micronaut:micronaut-json-core",
            "io.micronaut:micronaut-jackson-databind",
            "ch.qos.logback:logback-classic"
          ]
          build = []
          test = [
            "io.micronaut.pyronaut:micronaut-pyronaut-pytest",
            "io.micronaut.test:micronaut-test-junit5",
            "io.micronaut.pyronaut:micronaut-pyronaut-requests"
          ]
          TOML

          cat > "$project/src/controllers.py" <<'PY'
          from micronaut.http.annotation import Get


          @Get(value="/", produces="text/plain")
          def index() -> str:
              return "Hello from Pyronaut"
          PY

          cat > "$project/config/application.toml" <<'TOML'
          [micronaut.application]
          name = "hello-pyronaut"

          [micronaut.server]
          port = 8080
          TOML

          cat > "$project/tests/test_controller.py" <<'PY'
          import pytest
          import requests

          from pyronaut.test import MicronautTest, micronaut_test_fixture


          @pytest.fixture
          def my_context(request):
              fixture = micronaut_test_fixture(request, MicronautTest())
              yield fixture
              fixture.stop()


          @pytest.fixture
          def client(my_context):
              return requests.with_context(my_context)


          def test_index(client):
              response = client.get("/")
              assert response.status_code == 200
              assert response.text == "Hello from Pyronaut"
          PY

      - name: Set up Pyronaut
        id: setup
        uses: ./
        with:
          pyronaut-version: ${{ inputs.pyronaut-version }}
          graalvm-version: ${{ inputs.graalvm-version }}
          project-dir: ${{ runner.temp }}/hello-world
          run-doctor: 'true'
          # While releases of micronaut-projects/pyronaut are private, the
          # native launcher bundles need a token that can read them.
          github-token: ${{ secrets.PYRONAUT_RELEASE_TOKEN || github.token }}

      - name: Resolve dependencies
        working-directory: ${{ runner.temp }}/hello-world
        run: pyronaut install

      - name: Process sources
        working-directory: ${{ runner.temp }}/hello-world
        run: pyronaut process

      - name: Run the tests
        working-directory: ${{ runner.temp }}/hello-world
        run: pyronaut test

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyronaut-reports-${{ inputs.runner }}
          path: ${{ runner.temp }}/hello-world/__pyronaut__/reports/
          if-no-files-found: ignore
